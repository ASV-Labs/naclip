name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: localhost-preview/package-lock.json
      - run: npm ci
        working-directory: localhost-preview
      - run: npm test
        working-directory: localhost-preview
      - run: npm run build
        working-directory: localhost-preview
      - run: node tandem/scripts/check-routing.mjs
      - run: node tandem/scripts/check-appearance.mjs
      - run: node tandem/scripts/check-workspaces.mjs
      - run: node tandem/scripts/check-layout.mjs
      - run: python3 landing/scripts/social-preview.py
      - run: python3 scripts/test-launcher.py
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - run: npm audit --audit-level=high
        working-directory: localhost-preview

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NaCLip social artwork source</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#101318;color:#fff;font-family:Helvetica,Arial,sans-serif}.frame{position:absolute;inset:24px;border:1px solid #353b45;border-radius:28px}.accent{position:absolute;top:24px;left:50%;transform:translateX(-50%);height:4px;width:104px;background:#5794e2;border-radius:0 0 4px 4px}.content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;gap:0}.eyebrow{color:#a6b3c7;font-size:12px;letter-spacing:3px;font-weight:500;margin-bottom:26px}.wordmark{font-size:126px;letter-spacing:-7px;line-height:1;font-weight:700}.wordmark span{font-weight:300;color:#83b6f4}.tagline{font-size:34px;line-height:1.2;letter-spacing:-.7px;margin-top:17px}.purpose{font-size:22px;color:#b9c6d7;margin-top:13px;line-height:1.4}.themes{display:flex;align-items:center;gap:26px;margin-top:32px;font-size:15px;color:#b9c6d7}.themes span{display:flex;align-items:center;gap:9px}.dot{width:9px;height:9px;border-radius:50%;background:#68717e}.dot.ocean{background:#5794e2}.dot.paper{background:#f4f3ed}.host{display:flex;align-items:center;gap:12px;margin-top:36px;font-size:17px;color:#c5cfdc}.host img{width:35px;height:35px;object-fit:contain;background:#fff;border-radius:8px;padding:3px}.credit{font-size:13px;color:#8f9cad;margin-top:10px}.address{position:absolute;bottom:45px;font-size:13px;color:#a6b3c7;letter-spacing:.5px}.wordmark,.tagline,.purpose,.themes,.host,.credit{max-width:600px}
@media(min-height:1000px){.frame{inset:38px;border-radius:36px}.accent{top:38px;width:150px;height:6px}.content{padding:90px;transform:translateY(-35px)}.eyebrow{font-size:18px;letter-spacing:4px;margin-bottom:50px}.wordmark{font-size:164px;letter-spacing:-9px}.tagline{font-size:46px;margin-top:35px}.purpose{font-size:31px;margin-top:22px;max-width:650px}.themes{font-size:24px;margin-top:54px;gap:33px}.dot{width:13px;height:13px}.host{font-size:24px;margin-top:72px}.host img{width:52px;height:52px;padding:5px}.credit{font-size:20px;margin-top:16px}.address{bottom:100px;font-size:22px}.wordmark,.tagline,.themes,.host,.credit{max-width:760px}}
@media(min-height:1700px){.content{transform:translateY(-160px)}.address{bottom:390px}.frame{inset:50px}.accent{top:50px}.tagline{font-size:48px}}

html{height:auto;overflow:auto}body{position:relative;width:1200px;height:630px}
body.story .content{transform:translateY(-160px)}body.story .address{bottom:390px}body.story .frame{inset:50px}body.story .accent{top:50px}body.story .tagline{font-size:48px}
</style></head><body><div class="frame"></div><div class="accent"></div><div class="content"><div class="eyebrow">ASV LABS / OPEN SOURCE</div><div class="wordmark">NaCL<span>ip</span></div><div class="tagline">Make the desk yours.</div><div class="purpose">Your skin for Hermes Desktop.</div><div class="themes"><span><i class="dot"></i>Graphite</span><span><i class="dot ocean"></i>Ocean</span><span><i class="dot paper"></i>Paper</span></div><div class="host"><img src="../landing/assets/hermes-agent.png" alt="Hermes Agent logo">Themes · Widgets · Appearance</div><div class="credit">Independent plugin by ASV Labs · Hermes by Nous Research</div><div class="address">asv-labs.github.io/naclip</div></div><script>
const format=new URLSearchParams(location.search).get('format');

  document.body.style.width='1080px';document.body.style.height=format==='post'?'1350px':'1920px';
  if(format==='story')document.body.classList.add('story');
}
</script></body></html>
